name: Persistent Linux Workspace Pro

on:
  workflow_dispatch: # Déclenchement manuel depuis l'interface GitHub

jobs:
  development_environment:
    name: Linux Workspace Core
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Limite maximale absolue de GitHub Actions (6 heures)

    steps:
      - name: 1. Extraction du Code Source
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 2. Configuration de l'Environnement Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Active le cache natif pour les dépendances Node

      - name: 3. Restauration du Cache Global & Applicatif
        id: global-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}
            /home/runner/.fcc
            ~/.local
            ~/.config
            /var/cache/apt/archives
          key: os-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            os-workspace-

      - name: 4. Mise à jour Système & Installation des Paquets Essentiels
        run: |
          echo "[SYS] Début de la mise à jour et du provisionnement..."
          sudo apt-get update
          
          # Installation automatisée et non-interactive des utilitaires indispensables
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            curl \
            git \
            jq \
            socat \
            tmux \
            unzip \
            wget
          
          # Configuration et persistance des répertoires applicatifs
          mkdir -p /home/runner/.fcc
          echo "[SYS] Système à jour et paquets configurés."

      - name: 5. Point d'Entrée du Runtime & Système d'Auto-Sauvegarde
        run: |
          echo "========================================================="
          echo "         SÉCURITÉ ET AUTO-SAVE ACTIVÉS (PRO)             "
          echo "========================================================="
          echo " La machine est sous haute surveillance :"
          echo " - Un arrêt manuel : créez le fichier 'stop.txt'"
          echo " - Un timeout (6h) ou une annulation : Sauvegarde Auto active."
          echo "========================================================="

          # --- FONCTION INTERCEPTATRICE (TRAP) POUR L'AUTO-SAVE ---
          trigger_auto_save() {
            echo -e "\n[⚠️ ALERT] Signal de fermeture détecté (Timeout ou Annulation) !"
            echo "[AUTO-SAVE] Initialisation de la procédure de sauvegarde d'urgence..."
            
            # Nettoyage préventif pour éviter une boucle d'arrêt lors de la prochaine session
            rm -f "${{ github.workspace }}/stop.txt"
            
            echo "[AUTO-SAVE] Clôture propre des processus effectuée. Cache prêt pour l'envoi."
            exit 0
          }

          # Liaison de la fonction aux signaux système Linux d'arrêt (SIGTERM = GitHub Cancel/Timeout)
          trap trigger_auto_save SIGTERM SIGINT

          # -----------------------------------------------------------------
          # EXÉCUTION DE VOS SCRIPT EN ARRIÈRE-PLAN
          # (Exemple : fcc-server &)
          # -----------------------------------------------------------------

          # Boucle de surveillance principale (Hautement optimisée)
          STOP_FILE="${{ github.workspace }}/stop.txt"
          
          while [ ! -f "$STOP_FILE" ]; do
            # Le "sleep" est mis en arrière-plan pour permettre à l'intercepteur (trap) 
            # de réagir instantanément sans attendre la fin des secondes de pause.
            sleep 5 & 
            wait $!
          done

          echo "[SIGNAL] Fichier 'stop.txt' détecté manuellement par l'architecte."
          echo "[CLEANUP] Suppression du descripteur d'arrêt..."
          rm -f "$STOP_FILE"
          echo "[SHUTDOWN] Fin de session propre demandée."
