name: Persistent Linux Ubuntu Workspace + SFTP & WebSSH Pro

on:
  workflow_dispatch: # Déclenchement manuel unifié depuis l'interface GitHub

# Fixation globale de l'environnement pour anticiper les politiques de dépréciation de GitHub (Obligatoire en 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workspace-host:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Augmenté à la limite maximale autorisée par GitHub (6 heures)

    steps:
      - name: "1. Checkout repository"
        uses: actions/checkout@v4
        with:
          clean: false # Préserve les modifications locales et fichiers non suivis entre les sessions

      - name: "2. Configuration Runtime Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Version stable LTS sans option 'cache' bloquante si le dépôt est vide

      - name: "3. Restauration Unifiée et Automatique du Workspace"
        id: cache-workspace
        uses: actions/cache@v4
        with:
          path: |
            /home/runner
            /usr/local
            /var/cache/apt/archives
          key: linux-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-workspace-

      - name: "4. Configuration et Installation des Accès (SSH, SFTP & Utilitaires)"
        env:
          SECURE_SSH_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          echo "[SYS] Mise à jour des miroirs APT..."
          sudo apt-get update -qq || true
          
          echo "[SYS] Installation des couches d'accès et outils de build essentiels..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openssh-server \
            ttyd \
            unzip \
            wget \
            curl \
            git \
            gnupg \
            build-essential \
            jq \
            socat \
            tmux || echo "[WARN] Certains paquets système secondaires n'ont pas pu être mis à jour."
          
          echo "[SYS] Configuration de la sécurité d'accès distant SSH/SFTP..."
          echo "runner:$SECURE_SSH_PASS" | sudo chpasswd
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          # Initialisation de la structure d'accueil pour tes outils d'IA (Free Claude Code)
          mkdir -p /home/runner/.fcc

      - name: "5. Connexion Sécurisée au Réseau Privé Tailscale"
        id: tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: "6. Lancement du Workspace Core & Système d'Auto-Save"
        env:
          SECURE_SSH_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          # Initialisation et démarrage du terminal WebSSH en arrière-plan sur le port 7681
          ttyd -i 0.0.0.0 -p 7681 -c "runner:$SECURE_SSH_PASS" bash > /home/runner/ttyd.log 2>&1 &
          
          echo "========================================================="
          echo "🌐 WORKSPACE LINUX ACTIF & INTERCONNECTÉ VIA TAILSCALE"
          echo "========================================================="
          echo "Accès WebSSH  : Disponible via ton IP Tailscale sur le port 7681"
          echo "Accès SFTP/SSH : Connecte ton VS Code sur l'IP Tailscale (User: runner)"

          # Tentative de récupération de l'IP Tailscale pour un affichage direct
          TS_IP=$(tailscale ip -4 || echo "Inconnue")
          echo "IP Tailscale détectée : $TS_IP"
          echo "========================================================="
          echo " Failsafes opérationnels :"
          echo " -> Arrêt contrôlé (SFTP/WebSSH) : Crée le fichier 'stop.txt'"
          echo " -> Fermeture forcée (GitHub Cancel) : Auto-Save géré par Signal Trap"
          echo "========================================================="

          # Initialisation des drapeaux de session
          rm -f /home/runner/stop.txt
          touch /home/runner/keepalive.txt

          # --- ROUTINE CRITIQUE : INTERCEPTION (TRAP) ET FIX DES PERMISSIONS ---
          trigger_auto_save() {
            echo -e "\n[⚠️ ALERT] Signal d'arrêt ou d'annulation détecté par l'infrastructure GitHub !"
            echo "[AUTO-SAVE] Libération des verrous de processus et destruction de ttyd..."
            sudo killall ttyd || true
            rm -f /home/runner/stop.txt
            rm -f /home/runner/keepalive.txt
            
            echo "[AUTO-SAVE] Application du correctif de permissions sur les dossiers système d'APT..."
            # Permet à l'action d'upload du cache de lire /var/cache/apt/archives sans erreur de droit
            sudo chown -R runner:runner /var/cache/apt/archives || true
            
            echo "[AUTO-SAVE] Environnement paré pour la sauvegarde d'état. Envoi imminent de l'archive."
            exit 0
          }
          
          # Liaison du piège aux signaux de fermeture brutale (clic sur 'Cancel Run' ou Timeout de 6h)
          trap trigger_auto_save SIGTERM SIGINT

          # Boucle principale de maintien de session (Haute performance, 0% CPU)
          while [ -f /home/runner/keepalive.txt ]; do
            if [ -f "/home/runner/stop.txt" ]; then
              echo "🛑 Signal d'arrêt manuel détecté depuis l'espace de travail."
              break
            fi
            # Le sleep est envoyé en arrière-plan pour garder le shell réactif aux signaux système (trap)
            sleep 10 &
            wait $!
          done

          # --- PROCÉDURE DE FERMETURE NOMINALE ACCÉLÉRÉE ---
          echo "[SHUTDOWN] Exécution de la fermeture standard du système."
          sudo killall ttyd || true
          rm -f /home/runner/keepalive.txt
          rm -f /home/runner/stop.txt
          
          echo "[SHUTDOWN] Application du correctif final de permissions pour la sauvegarde du cache..."
          sudo chown -R runner:runner /var/cache/apt/archives || true
          echo "[SHUTDOWN] Session clôturée avec succès."
