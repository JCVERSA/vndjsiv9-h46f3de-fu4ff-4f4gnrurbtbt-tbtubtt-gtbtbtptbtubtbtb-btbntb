name: Persistent Linux Ubuntu Workspace + SFTP & WebSSH

on:
  workflow_dispatch:

jobs:
  workspace-host:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ==========================================
      # 1. RESTAURATION GLOBALE DE L'ENVIRONNEMENT
      # ==========================================
      - name: "Restauration du Workspace (Système & Données)"
        id: cache-workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner
            /usr/local
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: linux-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-workspace-

      # ==========================================
      # 2. VÉRIFICATION / CONFIGURATION DES ACCÈS
      # ==========================================
      - name: "Configurer et démarrer les accès SSH et WebSSH"
        run: |
          # Mise à jour des dépôts uniquement si le cache APT est vide ou ancien
          sudo apt-get update -qq
          
          # Installation des outils d'accès s'ils ne sont pas déjà présents
          sudo apt-get install -y openssh-server ttyd unzip wget curl git gnupg
          
          # Configuration du mot de passe pour l'accès SFTP/SSH
          echo "runner:${{ secrets.SFTP_PASS }}" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      # ==========================================
      # 3. CONNEXION SÉCURISÉE VIA TAILSCALE
      # ==========================================
      - name: "Connexion Tailscale (Accès Privé)"
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # ==========================================
      # 4. EXÉCUTION & MAINTIEN DE LA SESSION DE DEV
      # ==========================================
      - name: "Lancement du Workspace & Monitoring"
        env:
          SECURE_SSH_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          # Lancement du terminal Web (WebSSH) en arrière-plan sur le port 7681
          ttyd -i 0.0.0.0 -p 7681 -c "runner:$SECURE_SSH_PASS" bash > /home/runner/ttyd.log 2>&1 &
          
          echo "========================================================="
          echo "🌐 WORKSPACE LINUX ACTIF & SÉCURISÉ"
          echo "========================================================="
          echo "Accès WebSSH : Disponible via ton IP Tailscale sur le port 7681"
          echo "Accès SFTP/SSH : Utilisateur 'runner' avec ton SFTP_PASS"
          echo "========================================================="
          echo "💡 Tout ce que tu installes dans /home/runner ou via curl"
          echo "   sera sauvegardé automatiquement à la fermeture !"
          echo "========================================================="

          # Création du fichier de signal d'arrêt s'il n'existe pas
          rm -f /home/runner/stop.txt
          touch /home/runner/keepalive.txt

          # Boucle principale de maintien (5h50 max)
          MAX_TIME=21000
          ELAPSED=0
          
          while [ -f /home/runner/keepalive.txt ]; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))
            
            # Détection du signal d'arrêt manuel via SFTP/WebSSH
            if [ -f "/home/runner/stop.txt" ]; then
              echo "🛑 Signal d'arrêt détecté via stop.txt ! Préparation de la sauvegarde..."
              rm -f /home/runner/stop.txt
              break
            fi

            # Sécurité Timeout de fin de cycle GitHub Actions
            if [ $ELAPSED -ge $MAX_TIME ]; then
              echo "⚠️ Temps maximum de session atteint. Fermeture automatique..."
              break
            fi
          done

      # ==========================================
      # 5. NETTOYAGE DES PROCESSUS AVANT SAUVEGARDE
      # ==========================================
      - name: "Libération des processus pour éviter les verrous de fichiers"
        if: always()
        run: |
          echo "Arrêt des outils en arrière-plan..."
          sudo killall ttyd || true
          rm -f /home/runner/keepalive.txt

      # ==========================================
      # 6. SAUVEGARDE STRICTE ET POST-JOB DU CACHE
      # ==========================================
      - name: "Sauvegarde du Workspace (Système & Données)"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner
            /usr/local
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: linux-workspace-${{ github.run_id }}-${{ github.run_attempt }}
