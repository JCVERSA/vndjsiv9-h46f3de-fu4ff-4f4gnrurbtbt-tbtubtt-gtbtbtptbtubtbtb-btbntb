name: Persistent Linux Ubuntu Workspace + SFTP & WebSSH Pro

on:
  workflow_dispatch: # Déclenchement manuel unifié depuis l'interface GitHub

# Anticipation des règles de dépréciation de GitHub pour sécuriser l'environnement en 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workspace-host:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Augmenté à la limite maximale autorisée (6 heures)

    steps:
      - name: "1. Checkout repository"
        uses: actions/checkout@v4
        with:
          clean: false # Préserve les modifications locales entre les sessions

      - name: "2. Configuration Runtime Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Version stable LTS sans option 'cache' pour éviter le crash si le dépôt est vide

      - name: "3. Restauration Unifiée et Automatique du Workspace"
        id: cache-workspace
        uses: actions/cache@v4
        with:
          # Inclusions de tes dossiers de données essentiels.
          # NOTE : Si ton cache sature à cause de /usr/local, retire cette ligne spécifique du tableau.
          path: |
            /home/runner
            /usr/local
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: linux-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-workspace-

      - name: "4. Configuration et Installation des Accès (SSH, SFTP & Utilitaires)"
        run: |
          echo "[SYS] Mise à jour des miroirs APT..."
          sudo apt-get update -qq || true
          
          echo "[SYS] Installation des couches d'accès et outils de build..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openssh-server \
            ttyd \
            unzip \
            wget \
            curl \
            git \
            gnupg \
            build-essential \
            jq \
            socat \
            tmux || echo "[WARN] Certains paquets système secondaires n'ont pas pu être mis à jour."
          
          echo "[SYS] Configuration de la sécurité d'accès distant..."
          # Synchronisation du mot de passe avec tes secrets de dépôt pour l'utilisateur runner
          echo "runner:${{ secrets.SFTP_PASS }}" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          # Assure la présence structurelle du dossier de configuration pour tes outils AI
          mkdir -p /home/runner/.fcc

      - name: "5. Connexion Sécurisée au Réseau Privé Tailscale"
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: "6. Lancement du Workspace Core & Système d'Auto-Save"
        env:
          SECURE_SSH_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          # Initialisation et démarrage du terminal WebSSH en arrière-plan sur le port 7681
          ttyd -i 0.0.0.0 -p 7681 -c "runner:$SECURE_SSH_PASS" bash > /home/runner/ttyd.log 2>&1 &
          
          echo "========================================================="
          echo "🌐 WORKSPACE LINUX ACTIF & INTERCONNECTÉ VIA TAILSCALE"
          echo "========================================================="
          echo "Accès WebSSH  : Disponible via ton IP Tailscale sur le port 7681"
          echo "Accès SFTP/SSH : Connecte ton VS Code sur l'IP Tailscale (User: runner)"
          echo "========================================================="
          echo " Failsafes opérationnels :"
          echo " -> Arrêt contrôlé (SFTP/WebSSH) : Crée le fichier 'stop.txt'"
          echo " -> Fermeture forcée (GitHub Cancel) : Auto-Save géré par Signal Trap"
          echo "========================================================="

          # Configuration des drapeaux de session
          rm -f /home/runner/stop.txt
          touch /home/runner/keepalive.txt

          # --- TOKENS D'INTERCEPTION ET D'ARRÊT PROPRE (TRAP) ---
          trigger_auto_save() {
            echo -e "\n[⚠️ ALERT] Signal d'arrêt ou d'annulation détecté par l'infrastructure GitHub !"
            echo "[AUTO-SAVE] Libération des verrous de processus et destruction de ttyd..."
            sudo killall ttyd || true
            rm -f /home/runner/stop.txt
            rm -f /home/runner/keepalive.txt
            echo "[AUTO-SAVE] Environnement nettoyé et synchronisé. Envoi imminent de l'archive d'état."
            exit 0
          }
          
          # Enregistrement du piège à signaux (SIGTERM s'active lors du clic sur 'Cancel Run' ou Timeout)
          trap trigger_auto_save SIGTERM SIGINT

          # Boucle de surveillance à haute performance énergétique (Pas de surcharge CPU)
          while [ -f /home/runner/keepalive.txt ]; do
            if [ -f "/home/runner/stop.txt" ]; then
              echo "🛑 Signal d'arrêt manuel détecté depuis l'espace de travail."
              break
            fi
            # Le sleep est exécuté en tâche de fond pour permettre au 'trap' de s'activer instantanément
            sleep 10 &
            wait $!
          done

          # Nettoyage standard de fin de tâche nominale
          echo "[SHUTDOWN] Exécution de la fermeture standard du système."
          sudo killall ttyd || true
          rm -f /home/runner/keepalive.txt
          rm -f /home/runner/stop.txt
