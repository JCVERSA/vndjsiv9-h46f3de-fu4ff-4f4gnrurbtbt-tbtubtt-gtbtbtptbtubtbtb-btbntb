name: Persistent Linux Workspace Pro

on:
  workflow_dispatch: # Déclenchement manuel contrôlé

# Forçage global de l'environnement pour anticiper les dépréciations de la plateforme
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  development_environment:
    name: Linux Workspace Core
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Limite maximale absolue de GitHub Actions (6 heures)

    steps:
      - name: 1. Extraction du Code Source
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 2. Configuration de l'Environnement Node.js (Version Active & Future)
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Passage à la version LTS supérieure pour éviter la dépréciation
          # CORRECTION CLÉ : Retrait de l'option cache: 'npm' pour éviter le plantage si le projet est vide

      - name: 3. Restauration du Cache Global & Applicatif
        id: global-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}
            /home/runner/.fcc
            ~/.local
            ~/.config
            /var/cache/apt/archives
          key: os-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            os-workspace-

      - name: 4. Mise à jour Système & Installation Sécurisée des Paquets Essentiels
        run: |
          echo "[SYS] Début de la mise à jour des dépôts..."
          
          # Tentative de mise à jour avec tolérance aux erreurs réseau passagères
          sudo apt-get update || true
          
          echo "[SYS] Installation non-interactive des utilitaires essentiels..."
          # Utilisation d'options strictes pour éviter tout blocage ou invite interactive
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            jq \
            socat \
            tmux \
            unzip \
            wget || echo "[WARN] Certains paquets n'ont pas pu être installés, poursuite du workflow."
          
          # Sécurisation et persistance des répertoires applicatifs
          mkdir -p /home/runner/.fcc
          echo "[SYS] Environnement système initialisé."

      - name: 5. Point d'Entrée du Runtime & Système d'Auto-Sauvegarde
        run: |
          echo "========================================================="
          echo "         SÉCURITÉ ET AUTO-SAVE ACTIVÉS (PRO)             "
          echo "========================================================="
          echo " Surveillance active de l'instance :"
          echo " - Arrêt propre manuel : créez le fichier 'stop.txt'"
          echo " - Timeout ou Annulation : Interception et Auto-Save"
          echo "========================================================="

          # --- ROUTINE D'INTERCEPTION (TRAP) POUR L'AUTO-SAVE ---
          trigger_auto_save() {
            echo -e "\n[⚠️ ALERT] Signal système de fermeture intercepté (Timeout ou Annulation) !"
            echo "[AUTO-SAVE] Lancement de la procédure de sauvegarde d'urgence..."
            
            # Nettoyage préventif du fichier d'arrêt pour la session suivante
            rm -f "${{ github.workspace }}/stop.txt"
            
            echo "[AUTO-SAVE] Nettoyage terminé. Transfert des données vers le gestionnaire de cache..."
            exit 0
          }

          # Liaison de la fonction aux signaux d'arrêt de GitHub (SIGTERM / SIGINT)
          trap trigger_auto_save SIGTERM SIGINT

          # -----------------------------------------------------------------
          # ZONE D'INJECTION DE VOS PROCESSUS EN ARRIÈRE-PLAN
          # (Exemple : fcc-server &)
          # -----------------------------------------------------------------

          STOP_FILE="${{ github.workspace }}/stop.txt"
          
          # Boucle de surveillance à haute performance et basse consommation CPU
          while [ ! -f "$STOP_FILE" ]; do
            # Exécution du sleep en arrière-plan pour que le shell reste à l'écoute des signaux 'trap'
            sleep 5 & 
            wait $!
          done

          echo "[SIGNAL] Fichier 'stop.txt' détecté manuellement."
          echo "[CLEANUP] Suppression du descripteur d'arrêt..."
          rm -f "$STOP_FILE"
          echo "[SHUTDOWN] Fin de session standard réussie."
